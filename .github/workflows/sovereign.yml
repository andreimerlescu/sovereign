name: Go Sovereign

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOPRIVATE: github.com/andreimerlescu/*
  GO_VERSION: '1.26.2'

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Configure private module access
        run: |
          git config --global url."https://${{ secrets.GIT_TOKEN }}@github.com/".insteadOf "https://github.com/"
          echo "machine github.com login andreimerlescu password ${{ secrets.GIT_TOKEN }}" >> ~/.netrc
          chmod 600 ~/.netrc

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: go vet
        run: go vet ./...

      - name: gofmt check
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "the following files need formatting:"
            gofmt -l .
            exit 1
          fi

      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build -o sovereign .

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: sovereign-${{ github.sha }}
          path: sovereign
          retention-days: 7