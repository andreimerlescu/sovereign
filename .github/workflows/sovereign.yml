name: Go Sovereign

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOPRIVATE: github.com/andreimerlescu/*
  GONOSUMDB: github.com/andreimerlescu/*
  GONOSUMCHECK: github.com/andreimerlescu/*
  # Pin Go version in one place -- update here to change all jobs
  GO_VERSION: '1.25.0'

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          # cache: true caches the module download cache and build cache
          # across runs -- this is the single biggest cost reduction
          cache: true

      - name: Configure private module access
        run: |
          git config --global url."https://${{ secrets.GIT_TOKEN }}@github.com/".insteadOf "https://github.com/"
          echo "machine github.com login andreimerlescu password ${{ secrets.GIT_TOKEN }}" >> ~/.netrc
          chmod 600 ~/.netrc

      # Lint steps first -- cheapest to fail, saves test minutes on bad code
      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: go vet
        run: go vet ./...

      - name: gofmt check
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "the following files need formatting:"
            gofmt -l .
            exit 1
          fi

      # Test runs after lint passes -- -race is required, no skip
      - name: Test
        run: go test -race ./...

      # Build is last -- if test passed the code compiles, this just
      # confirms the binary artifact can be produced cleanly
      - name: Build
        run: go build -o sovereign .

      # Upload the binary so it can be downloaded from the Actions UI
      # without re-running the workflow -- costs nothing extra
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: sovereign-${{ github.sha }}
          path: sovereign
          retention-days: 7